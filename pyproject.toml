[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "dpai-sds-gen"
version = "0.1.0"
description = "AI-driven SDS (Software Design Specification) generator for IEC 62304 medical device software"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "google-genai>=1.0.0",
    "python-docx>=1.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
dpai_sds_gen = "src.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
